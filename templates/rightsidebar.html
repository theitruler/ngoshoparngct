<!-- templates/rightsidebar.html -->
<div id="variant-sidebar" class="fixed inset-y-0 right-0 w-full max-w-md bg-white shadow-xl z-50 transform translate-x-full transition-transform duration-300 overflow-y-auto">
  <div class="p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-gray-900">Select Options</h2>
      <button id="close-sidebar" class="text-gray-500 hover:text-gray-700">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <div class="space-y-5">
      <!-- Product Preview -->
      <div class="flex items-center space-x-4">
        <img id="sidebar-product-img" src="" alt="Product" class="h-16 w-16 object-contain rounded border">
        <div>
          <h3 id="sidebar-product-name" class="font-semibold text-gray-900"></h3>
          <p id="sidebar-product-price" class="text-primary font-medium"></p>
        </div>
      </div>

      <!-- Variant Selector -->
      <div id="variant-selector-container">
        <!-- Filled dynamically by JS -->
      </div>

      <!-- Quantity -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">Quantity</label>
        <div class="flex items-center border rounded-lg overflow-hidden w-28">
          <button id="qty-dec" class="px-3 py-2 hover:bg-gray-100 disabled:opacity-50" disabled>
            <i class="fas fa-minus text-gray-600"></i>
          </button>
          <span id="qty-value" class="px-3 py-2 font-medium">1</span>
          <button id="qty-inc" class="px-3 py-2 hover:bg-gray-100">
            <i class="fas fa-plus text-primary"></i>
          </button>
        </div>
      </div>

      <button id="sidebar-add-to-cart" class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition">
        Add to Cart
      </button>
    </div>
  </div>
</div>

<!-- Overlay -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const sidebar = document.getElementById('variant-sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const closeBtn = document.getElementById('close-sidebar');
  const qtyValue = document.getElementById('qty-value');
  const qtyDec = document.getElementById('qty-dec');
  const qtyInc = document.getElementById('qty-inc');
  const addToCartBtn = document.getElementById('sidebar-add-to-cart');
  const variantContainer = document.getElementById('variant-selector-container');

  let currentProductId = null;
  let selectedVariant = null;
  let quantity = 1;

  // Open sidebar from anywhere
  window.openVariantSidebar = (product) => {
    currentProductId = product.id;
    document.getElementById('sidebar-product-name').textContent = product.name;
    document.getElementById('sidebar-product-price').textContent = '₹' + product.price;
    document.getElementById('sidebar-product-img').src = product.image;

    // Reset state
    quantity = 1;
    qtyValue.textContent = '1';
    qtyDec.disabled = true;
    selectedVariant = null;

    // Render variants
    if (product.variants && product.variants.length > 0) {
      let html = `<label class="block text-gray-700 font-medium mb-2">Choose Variant</label><div class="grid grid-cols-1 gap-3">`;
      product.variants.forEach((v, idx) => {
        html += `
          <label class="border rounded-lg p-3 cursor-pointer hover:bg-gray-50 flex items-center space-x-3 variant-option" data-variant='${JSON.stringify(v)}'>
            <input type="radio" name="selected-variant" value="${idx}" class="sr-only peer" />
            <span class="inline-block w-4 h-4 rounded-full border border-gray-300 peer-checked:border-indigo-600 peer-checked:bg-indigo-600 flex items-center justify-center">
              <i class="fas fa-check text-white text-xs hidden peer-checked:block"></i>
            </span>
            <span>
              <span class="font-medium">${v.color}</span>
              ${v.size ? ` • ${v.size}` : ''}
            </span>
          </label>
        `;
      });
      html += `</div>`;
      variantContainer.innerHTML = html;

      // Attach event listeners to new options
      document.querySelectorAll('.variant-option').forEach(opt => {
        opt.addEventListener('click', () => {
          selectedVariant = JSON.parse(opt.dataset.variant);
          document.querySelectorAll('.variant-option input').forEach(inp => inp.checked = false);
          opt.querySelector('input').checked = true;
        });
      });
    } else {
      variantContainer.innerHTML = '<p class="text-gray-500">No variants available.</p>';
      selectedVariant = null;
    }

    // Show sidebar
    sidebar.classList.remove('translate-x-full');
    overlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  };

  // Close sidebar
  const closeSidebar = () => {
    sidebar.classList.add('translate-x-full');
    overlay.classList.add('hidden');
    document.body.style.overflow = '';
  };
  closeBtn.addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);

  // Quantity controls
  qtyInc.addEventListener('click', () => {
    quantity++;
    qtyValue.textContent = quantity;
    qtyDec.disabled = false;
  });

  qtyDec.addEventListener('click', () => {
    if (quantity > 1) {
      quantity--;
      qtyValue.textContent = quantity;
      qtyDec.disabled = quantity <= 1;
    }
  });

  // Add to cart
addToCartBtn.addEventListener('click', async () => {
if (!currentProductId) return;
try {
await window.globalCart.addToCart(currentProductId, quantity, selectedVariant);
closeSidebar();
} catch (err) {
console.error(err);
alert('Failed to add item. Please try again.');
}
});
});
</script>
