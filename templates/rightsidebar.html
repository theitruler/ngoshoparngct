<!-- templates/rightsidebar.html -->
<div id="variant-sidebar" class="fixed inset-y-0 right-0 w-full max-w-md bg-white shadow-xl z-50 transform translate-x-full transition-transform duration-300 overflow-y-auto">
  <div class="p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-gray-900">Select Options</h2>
      <button id="close-sidebar" class="text-gray-500 hover:text-gray-700 focus:outline-none">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
    
    <div class="space-y-5">
      <!-- Product Preview -->
      <div class="flex items-center space-x-4">
        <img id="sidebar-product-img" src="" alt="Product" class="h-16 w-16 object-contain rounded border bg-white">
        <div>
          <h3 id="sidebar-product-name" class="font-semibold text-gray-900 leading-tight"></h3>
          <p id="sidebar-product-price" class="text-primary font-medium mt-1"></p>
        </div>
      </div>

      <!-- Color Selector -->
      <div id="color-selector-container"></div>
      
      <!-- Size Selector -->
      <div id="size-selector-container"></div>
      
      <!-- Quantity -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">Quantity</label>
        <div class="flex items-center border rounded-lg overflow-hidden w-28">
          <button id="qty-dec" class="px-3 py-2 hover:bg-gray-100 disabled:opacity-50 focus:outline-none" disabled>
            <i class="fas fa-minus text-gray-600"></i>
          </button>
          <span id="qty-value" class="px-3 py-2 font-medium text-center w-full select-none">1</span>
          <button id="qty-inc" class="px-3 py-2 hover:bg-gray-100 focus:outline-none">
            <i class="fas fa-plus text-primary"></i>
          </button>
        </div>
      </div>

      <button id="sidebar-add-to-cart" class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition transform active:scale-95">
        Add to Cart
      </button>
    </div>
  </div>
</div>

<!-- Overlay -->
<div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const sidebar = document.getElementById('variant-sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const closeBtn = document.getElementById('close-sidebar');
  const qtyValue = document.getElementById('qty-value');
  const qtyDec = document.getElementById('qty-dec');
  const qtyInc = document.getElementById('qty-inc');
  const addToCartBtn = document.getElementById('sidebar-add-to-cart');
  const colorContainer = document.getElementById('color-selector-container');
  const sizeContainer = document.getElementById('size-selector-container');
  
  let currentProductId = null;
  let selectedColor = null;
  let selectedSize = null;
  let quantity = 1;

  // GLOBAL FUNCTION: Called from products.html
  window.openVariantSidebar = (product) => {
    console.log("Opening sidebar for:", product);
    
    if (!product || !product.id) {
      console.error("Invalid product data");
      return;
    }

    currentProductId = product.id;
    
    // Set Text Content (Safe checks)
    const nameEl = document.getElementById('sidebar-product-name');
    const priceEl = document.getElementById('sidebar-product-price');
    const imgEl = document.getElementById('sidebar-product-img');

    if(nameEl) nameEl.textContent = product.name ? String(product.name).trim() : 'Unknown Product';
    if(priceEl) priceEl.textContent = '₹' + product.price;
    
    // FIX: Handle Image Array vs String
    let imgUrl = '/static/placeholder.png'; // Default fallback
    if (product.images && Array.isArray(product.images) && product.images.length > 0) {
      imgUrl = product.images[0];
    } else if (product.image && typeof product.image === 'string') {
      imgUrl = product.image;
    }
    
    if(imgEl) imgEl.src = imgUrl.trim();

    // Reset State
    quantity = 1;
    if(qtyValue) qtyValue.textContent = '1';
    if(qtyDec) qtyDec.disabled = true;
    selectedColor = null;
    selectedSize = null;

    // Render Colors
    if (product.colors && Array.isArray(product.colors) && product.colors.length > 0) {
      let colorHtml = `<label class="block text-gray-700 font-medium mb-2">Color</label><div class="grid grid-cols-2 gap-2">`;
      product.colors.forEach(color => {
        const cleanColor = String(color).trim();
        colorHtml += `
          <button type="button" class="color-option border rounded-lg p-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center justify-center transition" data-color="${cleanColor}">
            ${cleanColor}
          </button>`;
      });
      colorHtml += `</div>`;
      colorContainer.innerHTML = colorHtml;
    } else {
      colorContainer.innerHTML = '';
    }

    // Render Sizes
    if (product.sizes && Array.isArray(product.sizes) && product.sizes.length > 0) {
      let sizeHtml = `<label class="block text-gray-700 font-medium mb-2">Size</label><div class="grid grid-cols-2 gap-2">`;
      product.sizes.forEach(size => {
        const cleanSize = String(size).trim();
        sizeHtml += `
          <button type="button" class="size-option border rounded-lg p-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center justify-center transition" data-size="${cleanSize}">
            ${cleanSize}
          </button>`;
      });
      sizeHtml += `</div>`;
      sizeContainer.innerHTML = sizeHtml;
    } else {
      sizeContainer.innerHTML = '';
    }

    // Re-attach Event Listeners for new buttons
    document.querySelectorAll('.color-option').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.color-option').forEach(b => {
          b.classList.remove('bg-indigo-100', 'border-indigo-600', 'text-indigo-700');
        });
        this.classList.add('bg-indigo-100', 'border-indigo-600', 'text-indigo-700');
        selectedColor = this.dataset.color;
      });
    });

    document.querySelectorAll('.size-option').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.size-option').forEach(b => {
          b.classList.remove('bg-indigo-100', 'border-indigo-600', 'text-indigo-700');
        });
        this.classList.add('bg-indigo-100', 'border-indigo-600', 'text-indigo-700');
        selectedSize = this.dataset.size;
      });
    });

    // Show Sidebar Animation
    sidebar.classList.remove('translate-x-full');
    overlay.classList.remove('hidden');
    document.body.style.overflow = 'hidden'; // Prevent background scrolling
  };

  const closeSidebar = () => {
    sidebar.classList.add('translate-x-full');
    overlay.classList.add('hidden');
    document.body.style.overflow = '';
  };

  if(closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if(overlay) overlay.addEventListener('click', closeSidebar);

  // Quantity Logic
  if(qtyInc) {
    qtyInc.addEventListener('click', () => {
      quantity++;
      qtyValue.textContent = quantity;
      if(qtyDec) qtyDec.disabled = false;
    });
  }
  if(qtyDec) {
    qtyDec.addEventListener('click', () => {
      if (quantity > 1) {
        quantity--;
        qtyValue.textContent = quantity;
        qtyDec.disabled = quantity <= 1;
      }
    });
  }

  // Add to Cart Logic
  if(addToCartBtn) {
    addToCartBtn.addEventListener('click', async () => {
      if (!currentProductId) return;

      const hasColors = document.querySelectorAll('.color-option').length > 0;
      const hasSizes = document.querySelectorAll('.size-option').length > 0;

      if (hasColors && !selectedColor) {
        alert('Please select a color.');
        return;
      }
      if (hasSizes && !selectedSize) {
        alert('Please select a size.');
        return;
      }

      let variant = null;
      if (selectedColor || selectedSize) {
        variant = {};
        if (selectedColor) variant.color = selectedColor;
        if (selectedSize) variant.size = selectedSize;
      }

      try {
        if (window.globalCart) {
          await window.globalCart.addToCart(currentProductId, quantity, variant);
          closeSidebar();
        } else {
          alert('Cart system not ready. Please refresh.');
        }
      } catch (err) {
        console.error(err);
        alert('Failed to add item.');
      }
    });
  }
});
</script>
