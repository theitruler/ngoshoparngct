{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex mb-8">
        <div class="flex-1 text-center pb-2 border-b-2 border-indigo-600 font-bold">Personal Details</div>
        <div class="flex-1 text-center pb-2 text-gray-400">Payment</div>
    </div>

    <div class="bg-white rounded-xl shadow p-6">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Shipping Information</h2>
        
        <form action="{{ url_for('payment') }}" method="GET">
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-1">Full Name</label>
                    <input type="text" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-gray-700 mb-1">Address</label>
                    <textarea required rows="3"
                              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 mb-1">City</label>
                        <input type="text" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-1">Postal Code</label>
                        <input type="text" required
                               class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                </div>
                
                <div>
                    <label class="block text-gray-700 mb-1">Phone</label>
                    <input type="tel" required
                           class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                </div>
            </div>
            
            <button type="submit" 
                    class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition">
                Proceed to Payment
            </button>
        </form>
    </div>
</div>
{% endblock %}
