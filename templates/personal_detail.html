{% extends "base.html" %}
{% block title %}Checkout{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="flex mb-8">
    <div class="flex-1 text-center pb-2 border-b-2 border-indigo-600 font-bold">Personal Details</div>
    <div class="flex-1 text-center pb-2 text-gray-400">Payment</div>
  </div>
  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Shipping Information</h2>
    <form action="{{ url_for('submit_personal_detail') }}" method="POST">
      <div class="space-y-4">
        <div>
          <label class="block text-gray-700 mb-1">Full Name</label>
          <input
            type="text"
            name="full_name"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="Enter your full name"
          >
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Address</label>
          <textarea
            name="address"
            required
            rows="3"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="Enter your full address"
          ></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 mb-1">City</label>
            <input
              type="text"
              name="city"
              required
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              placeholder="e.g. Mumbai"
            >
          </div>
          <div>
            <label class="block text-gray-700 mb-1">Postal Code</label>
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]{6}"
              name="postal_code"
              required
              minlength="6"
              maxlength="6"
              title="Enter a valid 6-digit Indian PIN code"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
              placeholder="123456"
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,6);"
            >
          </div>
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Phone</label>
          <input
            type="tel"
            inputmode="tel"
            pattern="[0-9]{10,15}"
            name="phone"
            required
            minlength="10"
            maxlength="15"
            title="Enter a valid phone number (10–15 digits)"
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="9876543210"
            oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0,15);"
          >
        </div>
      </div>
      <button
        type="submit"
        class="mt-6 w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition"
      >
        Proceed to Payment
      </button>
    </form>
  </div>
</div>
{% endblock %}
