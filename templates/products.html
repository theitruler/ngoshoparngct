{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<div class="mb-8 text-center">
<h1 class="text-3xl md:text-4xl font-bold text-gray-900">Shop Our Collection</h1>
<p class="text-gray-600 mt-2 max-w-2xl mx-auto">Discover high-quality products designed for everyday use</p>
</div>
<div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
{% for product in products %}
<div
class="product-card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow cursor-pointer border border-gray-100"
data-product-id="{{ product.id }}"
>
<div class="h-48 flex items-center justify-center bg-gray-50 p-4">
<img
src="{{ product.image }}"
alt="{{ product.name }}"
class="max-h-40 max-w-full object-contain transition-transform hover:scale-105"
>
</div>
<div class="p-4 md:p-5">
<h2 class="text-lg md:text-xl font-bold text-gray-900 mb-1 line-clamp-1">{{ product.name }}</h2>
<p class="text-gray-600 text-sm mb-3 line-clamp-2">{{ product.description }}</p>
<div class="flex justify-between items-center pt-3 border-t border-gray-100">
<span class="text-xl font-bold text-primary">₹{{ product.price }}</span>
<!-- ACTION CONTAINER - JS will replace this -->
<div class="action-container" data-product-card data-product-id="{{ product.id }}">
<button class="add-to-cart-btn bg-primary text-white py-1.5 px-4 rounded-lg text-sm opacity-75 cursor-not-allowed">
<i class="fas fa-spinner fa-spin"></i>
</button>
</div>
</div>
</div>
</div>
{% endfor %}
</div>
{% endblock %}
