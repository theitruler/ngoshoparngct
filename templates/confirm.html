<!-- templates/confirm.html -->
{% extends "base.html" %}
{% block title %}Order Confirmed{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto text-center py-12">
  <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 mb-6">
    <i class="fas fa-check-circle text-green-600 text-3xl"></i>
  </div>
  <h1 class="text-3xl font-bold text-gray-900 mb-4">Thank You!</h1>
  <p class="text-gray-600 text-lg mb-8">
    Your order has been confirmed and is being processed.<br>
    A confirmation email will be sent shortly.
  </p>
  <a href="{{ url_for('products') }}" class="inline-block bg-primary hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-lg transition">
    Continue Shopping
  </a>
</div>
{% endblock %}
